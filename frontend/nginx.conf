server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 16k;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # The API is only reachable through this proxy. The backend container publishes no port.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's internal DNS, so a restarted backend is found again
    set $backend http://backend:4000;
    proxy_pass $backend;                       # a variable without a path keeps the original /api/... URI
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
  }

  location /assets/ {
    expires 7d;
    try_files $uri =404;
  }

  # Single page app: unknown paths (/services, /incidents ...) are handled by React Router
  location / {
    try_files $uri /index.html;
  }
}